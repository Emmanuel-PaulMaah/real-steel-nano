<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Real Steel Tiny Demo</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0f14; color: #e8eef7; font-family: system-ui, sans-serif; }
    #wrap { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }
    header, footer { padding: 10px 12px; }
    header { display:flex; gap:12px; align-items:center; flex-wrap: wrap; }
    button { background:#1b2430; color:#e8eef7; border:1px solid #2a3a4e; padding:8px 10px; border-radius:10px; cursor:pointer; }
    button:hover { border-color:#3d5876; }
    .pill { padding:6px 10px; border:1px solid #2a3a4e; border-radius:999px; background:#111826; font-size: 13px; }
    canvas { width: 100%; height: 100%; display:block; }
    .kbd { opacity: .85; font-size: 13px; line-height: 1.4; }
    code { background:#111826; padding:2px 6px; border-radius: 6px; border:1px solid #223246; }
  </style>
</head>
<body>
<div id="wrap">
  <header>
    <button id="micBtn">🎙️ Start voice</button>
    <span class="pill" id="micStatus">mic: off</span>
    <span class="pill" id="statePill">state: idle</span>
    <span class="pill" id="lastCmd">last: —</span>
  </header>

  <canvas id="c"></canvas>

  <footer class="kbd">
    Voice: say anything containing: “left / right / jab / hook / punch / kick / block / guard / idle / reset / combo”<br/>
    Keyboard: <code>A</code>/<code>D</code> move, <code>J</code> jab, <code>K</code> hook, <code>L</code> kick, <code>Space</code> block, <code>R</code> reset
  </footer>
</div>

<script>
(() => {
  // ---------- Canvas ----------
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  function resize() {
    const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    canvas.width = Math.floor(canvas.clientWidth * dpr);
    canvas.height = Math.floor(canvas.clientHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // draw in CSS pixels
  }
  window.addEventListener('resize', resize);

  // ---------- UI ----------
  const micBtn = document.getElementById('micBtn');
  const micStatus = document.getElementById('micStatus');
  const statePill = document.getElementById('statePill');
  const lastCmdEl = document.getElementById('lastCmd');

  function setLast(cmd) {
    lastCmdEl.textContent = `last: ${cmd || '—'}`;
  }
  function setStatePill(s) {
    statePill.textContent = `state: ${s}`;
  }

  // ---------- Fighter ----------
  const fighter = {
    x: 220,
    state: 'idle',
    t: 0,
    lock: 0,
    queued: null,
    hitFlash: 0,
  };

  function setState(name, duration) {
    fighter.state = name;
    fighter.t = 0;
    fighter.lock = duration || 0;
    setStatePill(name);
  }

  function queueOrRun(actionFn) {
    if (fighter.lock > 0) {
      fighter.queued = actionFn; // tiny MVP: keep only 1 queued
      return;
    }
    actionFn();
  }

  // ---------- Floating command caption (above robot) ----------
  // Shows ONLY when a valid command is detected.
  const cmdCaption = {
    text: '',
    ttl: 0,        // seconds remaining
    ttlMax: 0.85,  // fade duration
  };

  function showCommandCaption(cmd) {
    cmdCaption.text = cmd;
    cmdCaption.ttl = cmdCaption.ttlMax;
  }

  // ---------- Actions ----------
  const ACTIONS = {
    left:  () => queueOrRun(() => { fighter.x -= 45; setState('step', 0.18); }),
    right: () => queueOrRun(() => { fighter.x += 45; setState('step', 0.18); }),
    reset: () => { fighter.x = 220; fighter.hitFlash = 0; fighter.queued = null; setState('idle', 0); },
    idle:  () => queueOrRun(() => setState('idle', 0)),
    block: () => queueOrRun(() => setState('guard', 0.60)),
    guard: () => queueOrRun(() => setState('guard', 0.60)),
    jab:   () => queueOrRun(() => { setState('jab', 0.28); fighter.hitFlash = 0.15; }),
    punch: () => queueOrRun(() => { setState('punch', 0.38); fighter.hitFlash = 0.18; }),
    hook:  () => queueOrRun(() => { setState('hook', 0.48); fighter.hitFlash = 0.22; }),
    kick:  () => queueOrRun(() => { setState('kick', 0.55); fighter.hitFlash = 0.22; }),
    combo: () => queueOrRun(() => {
      setState('jab', 0.28);
      fighter.queued = () => {
        setState('jab', 0.28);
        fighter.queued = () => setState('hook', 0.48);
      };
      fighter.hitFlash = 0.30;
    }),
  };

  // ---------- Command detection ----------
  // Goal: if phrase contains a command word, return ONLY that command.
  // e.g. "i want it to jab right now" -> "jab"
  function detectCommand(phrase) {
    if (!phrase) return null;
    const t = phrase.toLowerCase().trim();

    // priority order matters: if someone says "go left" we want left, etc.
    // also include a couple common mishears (jab -> job)
    const rules = [
      { cmd: 'reset', words: ['reset'] },
      { cmd: 'idle',  words: ['idle'] },

      { cmd: 'combo', words: ['combo'] },

      { cmd: 'block', words: ['block'] },
      { cmd: 'guard', words: ['guard'] },

      { cmd: 'jab',   words: ['jab', 'job'] },
      { cmd: 'hook',  words: ['hook'] },
      { cmd: 'punch', words: ['punch'] },
      { cmd: 'kick',  words: ['kick'] },

      { cmd: 'left',  words: ['left'] },
      { cmd: 'right', words: ['right'] },
    ];

    // Exact phrase mapping (optional tiny sugar)
    const exactMap = new Map([
      ['go left','left'], ['move left','left'], ['step left','left'],
      ['go right','right'], ['move right','right'], ['step right','right'],
    ]);
    if (exactMap.has(t)) return exactMap.get(t);

    // Word-boundary contains check: avoids matching "right" inside "bright"
    for (const r of rules) {
      for (const w of r.words) {
        const re = new RegExp(`\\b${escapeRegExp(w)}\\b`, 'i');
        if (re.test(t)) return r.cmd;
      }
    }
    return null;
  }

  function escapeRegExp(s) {
    return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function runDetected(phrase) {
    const cmd = detectCommand(phrase);
    if (!cmd) return;                // IMPORTANT: show nothing if no command found
    setLast(cmd);
    showCommandCaption(cmd);         // IMPORTANT: show ONLY the command
    const fn = ACTIONS[cmd];
    if (fn) fn();
  }

  // ---------- Speech Recognition ----------
  let recognition = null;
  let listening = false;

  function setupSpeech() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return null;

    const rec = new SR();
    rec.lang = 'en-US';
    rec.interimResults = false;
    rec.continuous = true;

    rec.onresult = (e) => {
      const res = e.results[e.results.length - 1];
      if (!res || !res[0]) return;
      const transcript = res[0].transcript;
      runDetected(transcript);
    };

    rec.onerror = (e) => {
      micStatus.textContent = `mic: error (${e.error})`;
    };

    rec.onend = () => {
      // Chrome often ends sessions; restart if user still wants listening
      if (listening) {
        try { rec.start(); } catch {}
      }
    };

    return rec;
  }

  function startVoice() {
    if (!recognition) recognition = setupSpeech();
    if (!recognition) {
      micStatus.textContent = 'mic: unsupported (try Chrome)';
      return;
    }
    listening = true;
    micStatus.textContent = 'mic: on';
    micBtn.textContent = '🛑 Stop voice';
    try { recognition.start(); } catch {}
  }

  function stopVoice() {
    listening = false;
    micStatus.textContent = 'mic: off';
    micBtn.textContent = '🎙️ Start voice';
    if (recognition) {
      try { recognition.stop(); } catch {}
    }
  }

  micBtn.addEventListener('click', () => {
    if (listening) stopVoice();
    else startVoice();
  });

  // ---------- Keyboard fallback ----------
  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    const k = e.key.toLowerCase();
    if (k === 'a') runDetected('left');
    if (k === 'd') runDetected('right');
    if (k === 'j') runDetected('jab');
    if (k === 'k') runDetected('hook');
    if (k === 'l') runDetected('kick');
    if (k === ' ') runDetected('block');
    if (k === 'r') runDetected('reset');
  });

  // ---------- Drawing ----------
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }

  function drawStickRobot(cx, groundY, s) {
    // proportions
    const headR = 14;
    const torso = 50;
    const hipW = 36;
    const arm = 32;
    const fore = 26;
    const leg = 38;
    const shin = 34;

    const p = s.lock > 0 ? clamp(s.t / s.lock, 0, 1) : 0;

    // default pose
    let leftShoulder = -0.4, rightShoulder = 0.4;
    let leftElbow = -0.6, rightElbow = 0.6;
    let leftHip = -0.2, rightHip = 0.2;
    let leftKnee = 0.2, rightKnee = 0.2;

    if (s.state === 'guard') {
      leftShoulder = -1.1; rightShoulder = -2.0;
      leftElbow = -0.2; rightElbow = -0.5;
    }
    if (s.state === 'jab') {
      const t = Math.sin(p * Math.PI);
      rightShoulder = lerp(0.2, -0.4, t);
      rightElbow = lerp(0.5, -0.1, t);
    }
    if (s.state === 'punch') {
      const t = Math.sin(p * Math.PI);
      rightShoulder = lerp(0.3, -0.2, t);
      rightElbow = lerp(0.7, -0.25, t);
    }
    if (s.state === 'hook') {
      const t = Math.sin(p * Math.PI);
      rightShoulder = lerp(0.4, -1.2, t);
      rightElbow = lerp(0.6, -0.6, t);
    }
    if (s.state === 'kick') {
      const t = Math.sin(p * Math.PI);
      rightHip = lerp(0.2, -0.9, t);
      rightKnee = lerp(0.2, -0.6, t);
    }
    if (s.state === 'step') {
      const t = Math.sin(p * Math.PI);
      leftHip = lerp(-0.2, -0.6, t);
      rightHip = lerp(0.2, 0.6, t);
    }

    // style
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#d6e3ff';
    ctx.fillStyle = '#d6e3ff';

    function line(x1,y1,x2,y2) { ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
    function joint(x,y,r=4) { ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }

    const neckX = cx;
    const neckY = groundY - (torso + 18 + leg + shin) + 20;
    const headX = neckX;
    const headY = neckY - 22;

    const shoulderX = neckX;
    const shoulderY = neckY + 10;
    const hipX = neckX;
    const hipY = shoulderY + torso;

    // head
    ctx.beginPath();
    ctx.arc(headX, headY, headR, 0, Math.PI*2);
    ctx.stroke();

    // torso + hips
    line(shoulderX, shoulderY, hipX, hipY);
    line(hipX - hipW/2, hipY, hipX + hipW/2, hipY);

    // arms
    function armChain(sideSign, shoulderAng, elbowAng) {
      const sx = shoulderX + sideSign*14;
      const sy = shoulderY + 2;

      const ex = sx + Math.cos(shoulderAng)*arm;
      const ey = sy + Math.sin(shoulderAng)*arm;

      const wx = ex + Math.cos(elbowAng)*fore;
      const wy = ey + Math.sin(elbowAng)*fore;

      line(sx, sy, ex, ey);
      line(ex, ey, wx, wy);
      joint(sx, sy); joint(ex, ey); joint(wx, wy, 3);
      return { handX: wx, handY: wy };
    }

    armChain(-1, leftShoulder, leftElbow);
    armChain(1, rightShoulder, rightElbow);

    // legs
    function legChain(sideSign, hipAng, kneeAng) {
      const hx = hipX + sideSign*10;
      const hy = hipY + 4;

      const kx = hx + Math.cos(hipAng)*leg;
      const ky = hy + Math.sin(hipAng)*leg;

      const ax = kx + Math.cos(kneeAng)*shin;
      const ay = ky + Math.sin(kneeAng)*shin;

      line(hx, hy, kx, ky);
      line(kx, ky, ax, ay);
      joint(hx, hy); joint(kx, ky); joint(ax, ay, 3);
      line(ax, ay, ax + sideSign*14, ay); // foot
    }

    legChain(-1, leftHip + 1.6, leftKnee + 1.6);
    legChain(1, rightHip + 1.6, rightKnee + 1.6);

    // hit indicator (cheap feedback)
    if (s.hitFlash > 0) {
      const hx = cx + 140;
      const hy = groundY - 120;
      ctx.globalAlpha = clamp(s.hitFlash / 0.22, 0, 1);
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(hx, hy, 18, 0, Math.PI*2);
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.lineWidth = 4;
    }
  }

  function drawCommandCaption(cx, yTop) {
    if (cmdCaption.ttl <= 0 || !cmdCaption.text) return;

    const a = clamp(cmdCaption.ttl / cmdCaption.ttlMax, 0, 1); // 1 -> 0
    const rise = (1 - a) * 28;

    ctx.save();
    ctx.globalAlpha = a;

    ctx.font = '700 26px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // outline for legibility
    ctx.lineWidth = 6;
    ctx.strokeStyle = '#0b0f14';
    ctx.strokeText(cmdCaption.text.toUpperCase(), cx, yTop - rise);

    ctx.fillStyle = '#e8eef7';
    ctx.fillText(cmdCaption.text.toUpperCase(), cx, yTop - rise);

    ctx.restore();
  }

  // ---------- Loop ----------
  resize();
  setState('idle', 0);
  setLast(null);

  let last = performance.now();

  function tick(dt) {
    fighter.x = clamp(fighter.x, 70, canvas.clientWidth - 70);

    fighter.t += dt;
    if (fighter.lock > 0) {
      fighter.lock -= dt;
      if (fighter.lock <= 0) {
        fighter.lock = 0;
        if (fighter.queued) {
          const q = fighter.queued;
          fighter.queued = null;
          q();
        } else {
          setState('idle', 0);
        }
      }
    }

    if (fighter.hitFlash > 0) fighter.hitFlash = Math.max(0, fighter.hitFlash - dt);
    if (cmdCaption.ttl > 0) cmdCaption.ttl = Math.max(0, cmdCaption.ttl - dt);
  }

  function render() {
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);

    // grid
    ctx.globalAlpha = 0.6;
    ctx.strokeStyle = '#1a2736';
    ctx.lineWidth = 1;
    for (let x = 0; x < w; x += 40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
    for (let y = 0; y < h; y += 40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
    ctx.globalAlpha = 1;

    // ground
    const groundY = h - 80;
    ctx.strokeStyle = '#2a3a4e';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(w, groundY); ctx.stroke();

    // opponent marker
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = '#2a3a4e';
    ctx.fillRect(w - 120, groundY - 160, 18, 160);
    ctx.globalAlpha = 1;

    // caption position = above head area
    const captionY = groundY - 220;
    drawCommandCaption(fighter.x, captionY);

    // fighter
    drawStickRobot(fighter.x, groundY, fighter);

    // hint
    ctx.fillStyle = '#8aa4c7';
    ctx.font = '14px system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('Say a phrase containing a command (e.g. “i want it to jab right now”).', 14, 22);
  }

  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    tick(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
